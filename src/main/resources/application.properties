# ==============================================================================
# SMART MUNICIPAL DISTRICT COOLING & ICE THERMAL ENERGY STORAGE (ITES) SYSTEM
# ==============================================================================
spring.application.name=Smart-Municipal-District-Cooling-ITES

# Server Port
server.port=8080

# ------------------------------------------------------------------------------
# DATABASE CONFIGURATION: DEFAULT (H2 In-Memory for Instant Out-of-the-Box Run)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:district_cooling_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ------------------------------------------------------------------------------
# MYSQL DATABASE CONFIGURATION (Uncomment to connect to local/production MySQL)
# Refer to DATABASE_SETUP.txt for database creation scripts and user grants.
# ------------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/district_cooling_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging Configuration
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
